name: Build APK e IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  android:
    name: APK (Android)
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Instalar dependencias
        run: npm ci

      - name: Instalar Cordova
        run: npm i -g cordova

      - name: Compilar Angular
        run: npx ng build

      - name: Agregar plataforma Android
        run: cordova platform add android

      - name: Compilar APK
        run: cordova build android --debug

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: TaskLab-apk
          path: platforms/android/app/build/outputs/apk/debug/*.apk

  ios:
    name: IPA (iOS, sin firmar)
    runs-on: macos-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Instalar Cordova
        run: npm i -g cordova

      - name: Compilar Angular
        run: npx ng build

      - name: Agregar plataforma iOS
        run: cordova platform add ios

      - name: Preparar proyecto Xcode
        run: cordova prepare ios

      - name: Compilar IPA sin firmar
        run: |
          cd platforms/ios
          if ls -d *.xcworkspace >/dev/null 2>&1; then
            WS=$(ls -d *.xcworkspace | head -1)
            DESTINO="-workspace $WS"
            SCHEME=$(basename "$WS" .xcworkspace)
          else
            PJ=$(ls -d *.xcodeproj | head -1)
            DESTINO="-project $PJ"
            SCHEME=$(basename "$PJ" .xcodeproj)
          fi
          echo "Usando $DESTINO con scheme $SCHEME"
          xcodebuild $DESTINO -scheme "$SCHEME" -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$GITHUB_WORKSPACE/build/app.xcarchive" archive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
          cd "$GITHUB_WORKSPACE"
          mkdir -p Payload
          cp -R build/app.xcarchive/Products/Applications/*.app Payload/
          zip -r TaskLab-unsigned.ipa Payload

      - name: Subir IPA
        uses: actions/upload-artifact@v4
        with:
          name: TaskLab-ipa
          path: TaskLab-unsigned.ipa
