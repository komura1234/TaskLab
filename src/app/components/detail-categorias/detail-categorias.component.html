<p class="titulo-seccion">Mis categorías</p>
<ion-list [inset]="true">
  @for (c of categorias(); track c.id) {
    <ion-item>
      <div slot="start" class="icono" [style.--color]="c.color">
        <ion-icon name="pricetag-outline"></ion-icon>
      </div>
      <ion-label>
        <h2>{{ c.nombre }}</h2>
        <p>{{ textoTareas(c.id) }}</p>
      </ion-label>
      <ion-button slot="end" fill="clear" aria-label="Editar" (click)="editar.emit(c)">
        <ion-icon slot="icon-only" name="create-outline"></ion-icon>
      </ion-button>
      <ion-button slot="end" fill="clear" color="danger" aria-label="Eliminar" (click)="eliminar(c)">
        <ion-icon slot="icon-only" name="trash-outline"></ion-icon>
      </ion-button>
    </ion-item>
  } @empty {
    <ion-item lines="none">
      <ion-label color="medium">{{ filtrando() ? 'Sin resultados' : 'Aún no tienes categorías' }}</ion-label>
    </ion-item>
  }
</ion-list>
