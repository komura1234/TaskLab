@for(t of tareasService.items(); track t.id){

<ion-card>

  <ion-card-content class="ion-display-flex ion-align-items-start">
   
    <ion-checkbox class="ion-margin-end"aria-label="Completar"></ion-checkbox>
   <div class="ion-flex-1 ion-display-flex ion-flex-column">
    <ion-card-title><h2>{{t.titulo}}</h2></ion-card-title>
    <ion-text color="medium">
      <P>{{t.descripcion}}</P>
    </ion-text>
    <ion-chip class="ion-align-self-start ion-no-margin ion-margin-top">Trabajo</ion-chip>
  </div> 

   <ion-button (click)="setOpen(true)" slot="end" size="small" aria-label="opciones" fill="clear" color="primary">
      <ion-icon  name="ellipsis-horizontal-outline"></ion-icon>
    </ion-button> 


   </ion-card-content>
 </ion-card>
}
    <ion-action-sheet
      [isOpen]="isActionSheetOpen"
      header="Actins"
      [buttons]="actionSheetButtons"
      (didDismiss)="setOpen(false)"
    >

    </ion-action-sheet>
