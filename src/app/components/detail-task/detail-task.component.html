<ion-card [class.completada]="task().completada">
  <ion-card-content class="ion-display-flex ion-align-items-start">
    <ion-checkbox
      class="ion-margin-end"
      aria-label="Completar"
      [checked]="task().completada"
      (ionChange)="alternar()"
    ></ion-checkbox>

    <div class="ion-flex-1 ion-display-flex ion-flex-column">


      <ion-card-title><h2 class="titulo">{{ task().titulo }}</h2></ion-card-title>
      @if (task().descripcion) {
        <ion-text color="medium"><p class="descripcion">{{ task().descripcion }}</p></ion-text>
      }
      @if (categoria(); as c) {
        <span class="chip ion-margin-top" [style.--color]="c.color"><span class="punto"></span>{{ c.nombre }}</span>
      }
    </div>

    <ion-button class="action" (click)="setOpen(true)" size="small" aria-label="Opciones" fill="clear" color="primary">
      <ion-icon slot="icon-only" name="ellipsis-horizontal-outline"></ion-icon>
    </ion-button>
    
  </ion-card-content>
</ion-card>

<ion-action-sheet
  [isOpen]="isActionSheetOpen"
  [header]="task().titulo"
  [buttons]="actionSheetButtons"
  (didDismiss)="onAction($event)"
></ion-action-sheet>
